<input type="text" id="hrpn" placeholder="Enter HRPN">
<button onclick="searchFaculty()">Search</button>

<div id="result"></div>

<script>

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSCv1H54WJPoysJZGfb1YmvPq1d5CuCKkFCTT3e_HYDEZ_gfWk68xHHEWZlLAJegOFvzh-aPL8KGHnX/pub?output=csv";

async function searchFaculty() {

let hrpn = document.getElementById("hrpn").value;

let response = await fetch(sheetURL);
let data = await response.text();

let rows = data.split("\n");

for(let i=1;i<rows.length;i++)
{
let cols = rows[i].split(",");

if(cols[0] == hrpn)
{
document.getElementById("result").innerHTML = `
<h2>${cols[1]}</h2>
<p><b>HRPN:</b> ${cols[0]}</p>
<p><b>PAN:</b> ${cols[3]}</p>
<p><b>DOB:</b> ${cols[4]}</p>
<p><b>Basic Pay:</b> ${cols[10]}</p>
<p><b>Pay Scale:</b> ${cols[11]}</p>
<img src="${cols[13]}" width="120">
`;
}
}

}

</script>
